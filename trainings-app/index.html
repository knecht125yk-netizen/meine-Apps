<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trainings-App</title>
  <meta name="description" content="Kopfrechnen, Englisch und Kommunikation trainieren – offline, auf PC und iPhone.">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="kopf">
    <button class="zurueck" id="zurueck" aria-label="Zurück" hidden>‹</button>
    <h1 id="titel">Training</h1>
    <div class="kopf-info">
      <span class="chip" id="chip-serie" title="Tage in Folge">🔥 0</span>
      <span class="chip" id="chip-xp" title="Erfahrungspunkte">⭐ 0</span>
    </div>
  </header>

  <main id="inhalt" tabindex="-1"></main>

  <nav class="leiste" aria-label="Hauptnavigation">
    <a href="#/start" data-tab="start"><span>🏠</span>Start</a>
    <a href="#/mathe" data-tab="mathe"><span>🧮</span>Mathe</a>
    <a href="#/englisch" data-tab="englisch"><span>🇬🇧</span>Englisch</a>
    <a href="#/kommunikation" data-tab="kommunikation"><span>💬</span>Reden</a>
    <a href="#/profil" data-tab="profil"><span>👤</span>Profil</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="konfetti" aria-hidden="true"></canvas>

  <noscript>Bitte JavaScript aktivieren, um die Trainings-App zu nutzen.</noscript>
  <script src="js/logik.js"></script>
  <script src="js/inhalt-englisch.js"></script>
  <script src="js/inhalt-kommunikation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
