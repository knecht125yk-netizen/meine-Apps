name: Trainings-App testen & veröffentlichen

on:
  push:
    paths: ["trainings-app/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["trainings-app/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (Logik & Inhalte)
        working-directory: trainings-app
        run: node --test tests/*.test.js

  deploy:
    # Veröffentlichen nur vom Standard-Branch (bzw. manuell gestartet)
    # Nur von main (oder manuell). Schlägt nicht rot fehl, solange Pages im Repo nicht aktiviert ist
    # (bei privaten Repos nur mit bezahltem GitHub-Plan möglich).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trainings-app
      - id: deployment
        uses: actions/deploy-pages@v4
